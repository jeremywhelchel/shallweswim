# Build and deploy Dockerfile to Cloud Run
# https://cloud.google.com/build/docs/build-config-file-schema
# https://cloud.google.com/build/docs/deploying-builds/deploy-cloud-run

substitutions:
  # Installation-local region, supplied by build_and_deploy.sh from
  # CLOUDSDK_RUN_REGION; the repository hard-codes no region.
  _REGION: ""
  _SERVICE_NAME: "shallweswim"
  _IMAGE_NAME: "${_REGION}-docker.pkg.dev/${PROJECT_ID}/gcr/${_SERVICE_NAME}"
  # Installation-local archive bucket for the capture job, and the bucket the
  # service loads published generations from. Empty by default so the
  # repository never hard-codes a bucket name; build_and_deploy.sh supplies it
  # from SHALLWESWIM_ARCHIVE_BUCKET and both deploy steps fail if it is empty.
  _ARCHIVE_BUCKET: ""

# The build runs as the deploy identity, shallweswim-ci in the target project;
# build_and_deploy.sh passes it with --service-account, derived from
# CLOUDSDK_CORE_PROJECT, so no project id is written here.

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-and-push
    entrypoint: bash
    args:
      - -c
      - |
        docker buildx create --name builder --driver docker-container --use
        docker buildx build \
          --platform linux/amd64 \
          -t ${_IMAGE_NAME}:${BUILD_ID} \
          --cache-from=type=registry,ref=${_IMAGE_NAME}:buildcache \
          --cache-to=type=registry,ref=${_IMAGE_NAME}:buildcache,mode=max \
          --push \
          .
    env:
      - DOCKER_BUILDKIT=1

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: cloud_run_deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_ARCHIVE_BUCKET}" ] || [ -z "${_REGION}" ]; then
          echo "ERROR: the _ARCHIVE_BUCKET or _REGION substitution is empty." >&2
          echo "Set SHALLWESWIM_ARCHIVE_BUCKET and CLOUDSDK_RUN_REGION in the operator" >&2
          echo "environment (see .env.example) and deploy with ./build_and_deploy.sh." >&2
          exit 1
        fi
        sed -e "s|\$${IMAGE_TAG}|${BUILD_ID}|g" \
            -e "s|\$${SHALLWESWIM_ARCHIVE_BUCKET}|${_ARCHIVE_BUCKET}|g" \
            -e "s|\$${PROJECT_ID}|${PROJECT_ID}|g" \
            -e "s|\$${REGION}|${_REGION}|g" \
            service.yaml > service-substituted.yaml
        gcloud run services replace service-substituted.yaml --region=${_REGION}

  # Replace the capture job after the service deploy so the job never runs a
  # stale image. See infra/capture-job/README.md for identities and scheduling.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: cloud_run_capture_job_deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_ARCHIVE_BUCKET}" ] || [ -z "${_REGION}" ]; then
          echo "ERROR: the _ARCHIVE_BUCKET or _REGION substitution is empty." >&2
          echo "Set SHALLWESWIM_ARCHIVE_BUCKET and CLOUDSDK_RUN_REGION in the operator" >&2
          echo "environment (see .env.example) and deploy with ./build_and_deploy.sh." >&2
          exit 1
        fi
        sed -e "s|\$${IMAGE_TAG}|${BUILD_ID}|g" \
            -e "s|\$${SHALLWESWIM_ARCHIVE_BUCKET}|${_ARCHIVE_BUCKET}|g" \
            -e "s|\$${PROJECT_ID}|${PROJECT_ID}|g" \
            -e "s|\$${REGION}|${_REGION}|g" \
            capture-job.yaml > capture-job-substituted.yaml
        gcloud run jobs replace capture-job-substituted.yaml --region=${_REGION}

options:
  dynamic_substitutions: true
  logging: CLOUD_LOGGING_ONLY
