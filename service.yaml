# Cloud Run service configuration
# Deploy with: gcloud run services replace service.yaml --region="$CLOUDSDK_RUN_REGION" (after the cloudbuild.yaml substitutions)
# NOTE: ${IMAGE_TAG} and ${SHALLWESWIM_ARCHIVE_BUCKET} are substituted by
# Cloud Build (see cloudbuild.yaml) before the file is applied, exactly as they
# are for capture-job.yaml.
# SHALLWESWIM_SNAPSHOT_READ_BUCKET is a read-only variable, and it is required:
# this service serves every request from the generations the capture job
# publishes under published/, keeps them current, and never contacts a data
# provider itself. Without the variable the process fails to start, because it
# would have nothing to serve. The service still never sets
# SHALLWESWIM_ARCHIVE_BUCKET (writes), SHALLWESWIM_ARCHIVE_READ_BUCKET (archive
# hydration), or SHALLWESWIM_SNAPSHOT_PUBLISH; the capture job remains the only
# writer. Rollback is routing traffic back to the previous revision, which
# fetches for itself and needs no store change.
# Docs: https://cloud.google.com/run/docs/reference/yaml/v1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shallweswim
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "50"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: shallweswim-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/gcr/shallweswim:${IMAGE_TAG}
          env:
            - name: SHALLWESWIM_LOG_FORMAT
              value: json
            - name: SHALLWESWIM_SNAPSHOT_READ_BUCKET
              value: ${SHALLWESWIM_ARCHIVE_BUCKET}
            - name: USGS_WATERDATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: waterdata_usgs_gov_api_key
                  key: latest
          ports:
            - containerPort: 8080
              name: http1
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/healthy?startup
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
  traffic:
    - percent: 100
      latestRevision: true
