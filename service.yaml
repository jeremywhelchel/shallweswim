# Cloud Run service configuration
# Deploy with: gcloud run services replace service.yaml --region=us-east4
# NOTE: ${IMAGE_TAG} and ${SHALLWESWIM_ARCHIVE_BUCKET} are substituted by
# Cloud Build (see cloudbuild.yaml) before the file is applied, exactly as they
# are for capture-job.yaml.
# SHALLWESWIM_SNAPSHOT_READ_BUCKET is a read-only variable: it enables shadow
# mode, in which this service loads the generations the capture job publishes
# under published/ and keeps them current, while continuing to fetch and serve
# as before. The service still never sets SHALLWESWIM_ARCHIVE_BUCKET (writes),
# SHALLWESWIM_ARCHIVE_READ_BUCKET (archive hydration), or
# SHALLWESWIM_SNAPSHOT_PUBLISH; the capture job remains the only writer.
# Rollback is removing this variable and redeploying.
# Docs: https://cloud.google.com/run/docs/reference/yaml/v1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shallweswim
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "50"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: shallweswim-runtime@shallweswim.iam.gserviceaccount.com
      containers:
        - image: us-east4-docker.pkg.dev/shallweswim/gcr/shallweswim:${IMAGE_TAG}
          env:
            - name: SHALLWESWIM_LOG_FORMAT
              value: json
            - name: SHALLWESWIM_SNAPSHOT_READ_BUCKET
              value: ${SHALLWESWIM_ARCHIVE_BUCKET}
            - name: USGS_WATERDATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: waterdata_usgs_gov_api_key
                  key: latest
          ports:
            - containerPort: 8080
              name: http1
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/healthy?startup
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
  traffic:
    - percent: 100
      latestRevision: true
